<title>Profile</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="robots" content="noindex"><link rel="stylesheet" href="../tokens.css?v=c327a17b"><link rel="stylesheet" href="../ds.css?v=f3e2f21f"><link rel="stylesheet" href="../style.css?v=50eade47">
<style>
/* Profil partagé : la page est portée par le lien, donc tout est local.
   Valeurs issues de tokens.css, composants de ds.css. */
.prof{max-width:780px;margin:0 auto;padding:0 var(--space-5) var(--space-10)}
.phead{text-align:center;padding:var(--space-10) 0 var(--space-1)}
.phead h1{font:400 40px/44px var(--font-display);margin:0 0 var(--space-1);letter-spacing:-.01em}
.phead .h{color:var(--ink-muted);font-size:15px;margin:0 0 var(--space-3)}
.phead a{color:var(--link);font-size:13px;margin:0 5px}
.psec{margin:var(--space-8) 0 0}
.psec h2{border-bottom:1px solid var(--line);padding-bottom:var(--space-2);margin:0 0 var(--space-4);display:block}
.xp{margin-bottom:var(--space-4)}
.xp .l1{display:flex;justify-content:space-between;gap:var(--space-3);font-weight:600}
.xp .l2{color:var(--ink-muted);font-size:13px;margin-bottom:var(--space-1)}
.xp ul{margin:0;padding-left:18px}.xp li{margin-bottom:3px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.pcard{padding:var(--space-4)}
.pcard h3{margin:0 0 var(--space-1);font:600 15px/22px var(--font-sans)}
.pcard p{margin:0 0 var(--space-2);color:var(--ink-muted);font-size:13px;line-height:20px;white-space:pre-wrap}
.pcard a{font-size:13px;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:var(--space-2)}
@media(max-width:700px){.cards{grid-template-columns:1fr}.phead h1{font:400 30px/36px var(--font-display)}}
</style></head>
