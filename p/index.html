<title>Profile</title><meta name="robots" content="noindex"><link rel="stylesheet" href="../tokens.css?v=1f4e1ec9"><link rel="stylesheet" href="../style.css?v=ce3a99bc"><link rel="stylesheet" href="../moi.css?v=fa4a7016">
<style>
.prof{max-width:780px;margin:0 auto;padding:0 18px}
.phead{text-align:center;padding:30px 0 4px}.phead h1{font-size:27px;margin:0 0 4px}.phead .h{color:var(--muted);font-size:15px;margin:0 0 10px}
.phead a{color:var(--acc);font-size:13.5px;text-decoration:none;margin:0 5px}
.psec{margin:26px 0 0}.psec h2{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px;margin:0 0 12px}
.xp{margin-bottom:16px}.xp .l1{display:flex;justify-content:space-between;gap:12px;font-weight:600}.xp .l2{color:var(--muted);font-size:13.5px;font-style:italic;margin-bottom:5px}
.xp ul{margin:0;padding-left:18px}.xp li{margin-bottom:3px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.pcard h3{margin:0 0 5px;font-size:15px}.pcard p{margin:0 0 8px;color:var(--muted);font-size:13.5px;line-height:1.45;white-space:pre-wrap}
.pcard a{color:var(--acc);font-size:13px;text-decoration:none;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.bandeau{background:var(--acc-bg);border:1px solid var(--acc);border-radius:10px;padding:11px 14px;margin:18px 0;font-size:13.5px}
@media(max-width:700px){.cards{grid-template-columns:1fr}}
</style></head>
